<div>
    <form [formGroup]="filterForm">
        <mat-accordion multi>
            <mat-expansion-panel>
                <mat-expansion-panel-header>
                    <mat-panel-title>Filters</mat-panel-title>
                </mat-expansion-panel-header>
                <div class="row">
                    <div class="col-10 col-sm-2">
                        <mat-form-field>
                            <input placeholder="ID" 
                            formControlName="id" 
                            matInput>
                        </mat-form-field>
                    </div>
                    <div class="col-10 col-sm-2">
                        <mat-form-field>
                            <input placeholder="Username" 
                            formControlName="userName" 
                            matInput >
                        </mat-form-field>
                    </div>
                    <div class="col-10 col-sm-2">
                        <mat-form-field>
                            <input placeholder="Login" 
                            formControlName="login" 
                            matInput >
                        </mat-form-field>
                    </div>
                </div>
            </mat-expansion-panel>
        </mat-accordion>
    </form>
</div>
<div class="row-cols-6">
    <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Id </th>
            <td mat-cell *matCellDef="let row"> {{row.id}} </td>
        </ng-container>
      
        <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef>Username</th>
            <td mat-cell *matCellDef="let row">{{row.userName}}</td>
        </ng-container>

        <ng-container matColumnDef="login">
            <th mat-header-cell *matHeaderCellDef>Login</th>
            <td mat-cell *matCellDef="let row">{{row.login}}</td>
        </ng-container>

        <ng-container matColumnDef="isOnline">
            <th mat-header-cell *matHeaderCellDef>Is Online</th>
            <td mat-cell *matCellDef="let row">{{row.isOnline}}</td>
        </ng-container> 

        <ng-container matColumnDef=" ">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Operations">
                  <mat-icon>more_vert</mat-icon>
                </button>
                  <mat-menu #menu="matMenu">
                    <button mat-menu-item>
                      <mat-icon>error</mat-icon>
                      <span>Ban</span>
                    </button>
                    <button mat-menu-item>
                      <mat-icon>delete</mat-icon>
                      <span>Delete</span>
                    </button>
                    <button mat-menu-item>
                      <mat-icon>contacts</mat-icon>
                      <span>Update</span>
                    </button>
                  </mat-menu>
            </td>
        </ng-container> 

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-paginator 
        [length]="length"
        [pageSize]="10"
        [showFirstLastButtons]="true"
        [pageSizeOptions]="[10, 20, 30, 50, 100]"
        aria-label="Select page"></mat-paginator>
</div>
